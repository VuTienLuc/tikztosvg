# Mỗi lần đẩy code lên nhánh main, workflow này chạy 3 bước:
#   1. test:   cài TeX Live, chạy thử máy chủ với hình thật, kiểm tra cú pháp Studio
#   2. pages:  xuất bản Studio + bộ cài Mac lên GitHub Pages
#   3. docker: đóng gói máy chủ thành image (Intel + Apple Silicon) lên ghcr.io
# Bước 2 và 3 chỉ chạy khi bước 1 đạt.
name: CI · Pages · Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Chạy thử máy chủ và Studio
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cài TeX Live + dvisvgm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            dvisvgm texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-science texlive-lang-other texlive-fonts-recommended

      - name: Biên dịch thử các hình mẫu
        run: python3 tests/smoke_test.py

      - name: Kiểm tra cú pháp JavaScript của Studio
        run: python3 tests/check_html.py index.html

  pages:
    name: Xuất bản Studio lên GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gom các tệp xuất bản
        run: |
          mkdir _site
          cp index.html install-mac.sh uninstall-mac.sh server/server.py _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  docker:
    name: Đóng gói image Docker (amd64 + arm64)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tikz-svg-server
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
